  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const chatBox = document.getElementById("chat-box");
      if (chatBox) {
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      const attachmentInput = document.getElementById("attachment-input");
      const attachmentName = document.getElementById("attachment-name");
      if (attachmentInput && attachmentName) {
        attachmentInput.addEventListener("change", function () {
          attachmentName.textContent = this.files && this.files.length > 0 ? this.files[0].name : "";
        });
      }

      const composerForm = document.getElementById("chat-composer-form");
      const messageInput = document.getElementById("chat-message-input");
      const convoIdInput = document.getElementById("chat-conversation-id");
      const currentConvoId = convoIdInput ? convoIdInput.value : null;
      let lastMsgId = 0;

      if (chatBox) {
        chatBox.querySelectorAll(".message[data-msg-id]").forEach(function (el) {
          const mid = parseInt(el.getAttribute("data-msg-id"), 10);
          if (!isNaN(mid) && mid > lastMsgId) {
            lastMsgId = mid;
          }
        });
      }

      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function appendMessageToChat(msg) {
        if (!chatBox) return;
        if (chatBox.querySelector(`.message[data-msg-id="${msg.id}"]`)) return;

        const isMe = Boolean(msg.is_me);
        const msgDiv = document.createElement("div");
        msgDiv.className = isMe
          ? "message sent flex flex-col gap-1 items-end self-end max-w-xl"
          : "message received flex flex-col gap-1 items-start max-w-xl";
        msgDiv.setAttribute("data-msg-id", msg.id);

        const safeSender = escapeHtml(msg.sender_name || "Đồng nghiệp");
        const safeContent = escapeHtml(msg.content || "");
        const searchText = (isMe ? "bạn " : safeSender.toLowerCase() + " ") + safeContent.toLowerCase();
        msgDiv.setAttribute("data-search-text", searchText);

        const headerSpan = document.createElement("span");
        headerSpan.className = "text-[11px] font-semibold text-slate-500";
        headerSpan.textContent = (isMe ? "Bạn" : safeSender) + " • " + (msg.created_at || "");
        msgDiv.appendChild(headerSpan);

        const bubble = document.createElement("div");
        if (isMe) {
          bubble.className = "p-3.5 rounded-2xl rounded-tr-sm bg-[#134c81] text-white text-sm leading-relaxed";
        } else {
          bubble.className = "p-3.5 rounded-2xl rounded-tl-sm bg-[#edf4fb] text-slate-800 text-sm leading-relaxed flex flex-col gap-2.5";
        }

        if (msg.content) {
          const p = document.createElement("p");
          p.className = "m-0 whitespace-pre-line";
          p.textContent = msg.content;
          bubble.appendChild(p);
        }

        if (msg.attachment) {
          const att = msg.attachment;
          if (att.is_media) {
            const imgWrap = document.createElement("div");
            imgWrap.className = "msg-inline-image-wrap mt-2";
            imgWrap.innerHTML = `
              <img src="${att.url}" alt="${escapeHtml(att.file_name)}" class="msg-inline-image max-h-48 rounded-xl object-cover cursor-pointer" onclick="if (typeof openImageLightbox === 'function') openImageLightbox(this.src);" />
              <a href="${att.url}" target="_blank" class="inline-flex items-center gap-1 ${isMe ? 'text-white' : 'text-[#134c81]'} font-semibold underline text-xs mt-1 shrink-0">Xem ảnh gốc</a>
            `;
            bubble.appendChild(imgWrap);
          } else {
            const fileWrap = document.createElement("div");
            fileWrap.className = isMe
              ? "flex items-center gap-2.5 p-2 bg-white/15 rounded-xl border border-white/20 text-xs text-white " + (msg.content ? "mt-2.5" : "")
              : "flex items-center gap-2.5 p-2 bg-white/70 rounded-xl border border-slate-200/60 text-xs text-slate-700 " + (msg.content ? "mt-2.5" : "");
            fileWrap.innerHTML = `
              <div class="${isMe ? 'text-white' : 'text-slate-500'} flex items-center justify-center shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </div>
              <div class="flex items-center gap-1.5 font-medium truncate">
                <span>${escapeHtml(att.file_name)}</span>
                ${att.file_size ? `<span class="opacity-60">•</span><span class="text-[11px] opacity-80">${escapeHtml(att.file_size)}</span>` : ''}
              </div>
              <a href="${att.url}" target="_blank" class="inline-flex items-center gap-1 ${isMe ? 'text-white' : 'text-[#134c81]'} font-semibold underline ml-2 shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Tải file
              </a>
            `;
            bubble.appendChild(fileWrap);
          }
        }

        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);

        if (msg.id > lastMsgId) {
          lastMsgId = msg.id;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
      }

      if (composerForm && messageInput) {
        messageInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            const hasText = messageInput.value.trim().length > 0;
            const hasFile = attachmentInput && attachmentInput.files && attachmentInput.files.length > 0;
            if (hasText || hasFile) {
              composerForm.requestSubmit();
            }
          }
        });

        if (currentConvoId) {
          composerForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const content = messageInput.value.trim();
            const hasAttachment = attachmentInput && attachmentInput.files && attachmentInput.files.length > 0;
            if (!content && !hasAttachment) return;

            const formData = new FormData(composerForm);
            const submitBtn = document.getElementById("chat-submit-btn");
            if (submitBtn) submitBtn.disabled = true;

            fetch("{% url 'api_send_message' %}", {
              method: "POST",
              body: formData,
              headers: {
                "X-Requested-With": "XMLHttpRequest"
              }
            })
            .then(res => res.json())
            .then(data => {
              if (submitBtn) submitBtn.disabled = false;
              if (data.success && data.message) {
                messageInput.value = "";
                if (attachmentInput) attachmentInput.value = "";
                if (attachmentName) attachmentName.textContent = "";
                appendMessageToChat(data.message);
              } else if (data.error) {
                alert(data.error);
              }
            })
            .catch(err => {
              if (submitBtn) submitBtn.disabled = false;
              console.error("Lỗi gửi tin nhắn:", err);
            });
          });
        }
      }

      function pollNewMessages() {
        if (!currentConvoId) return;
        const url = `/message/api/messages/${currentConvoId}/?after_id=${lastMsgId}`;
        fetch(url, {
          headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(res => res.json())
        .then(data => {
          if (data.success && Array.isArray(data.messages) && data.messages.length > 0) {
            data.messages.forEach(msg => appendMessageToChat(msg));
          }
        })
        .catch(err => {
          // Polling handled
        });
      }

      if (currentConvoId) {
        setInterval(pollNewMessages, 2500);
      }

      const emojiToggle = document.getElementById("emoji-toggle-btn");
      const emojiPopover = document.getElementById("emoji-popover");
      if (emojiToggle && emojiPopover && messageInput) {
        emojiToggle.addEventListener("click", function (e) {
          e.stopPropagation();
          emojiPopover.classList.toggle("is-hidden");
        });
        emojiPopover.querySelectorAll(".emoji-choice-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            messageInput.value += btn.getAttribute("data-emoji") || "";
            emojiPopover.classList.add("is-hidden");
            messageInput.focus();
          });
        });
        document.addEventListener("click", function (e) {
          if (!emojiPopover.contains(e.target) && e.target !== emojiToggle) {
            emojiPopover.classList.add("is-hidden");
          }
        });
      }

      const sidebarSearch = document.getElementById("sidebar-convo-search");
      if (sidebarSearch) {
        sidebarSearch.addEventListener("input", function () {
          const q = this.value.trim().toLowerCase();
          document.querySelectorAll("#sidebar-convo-list .convo-item").forEach(function (item) {
            const haystack = (item.getAttribute("data-convo-name") || item.textContent || "").toLowerCase();
            item.style.display = !q || haystack.indexOf(q) !== -1 ? "" : "none";
          });
        });
      }

      const searchToggleBtn = document.getElementById("toggle-chat-search");
      const searchPanel = document.getElementById("in-chat-search-panel");
      const searchInput = document.getElementById("in-chat-search-input");
      const searchClearBtn = document.getElementById("in-chat-search-clear");
      const searchStatus = document.getElementById("in-chat-search-status");

      function applyChatSearch(term) {
        if (!chatBox) return;
        const q = term.trim().toLowerCase();
        const messages = chatBox.querySelectorAll(".message");
        let matchedCount = 0;

        messages.forEach(function (msgEl) {
          if (!q) {
            msgEl.classList.remove("is-search-hidden", "is-search-match");
            return;
          }
          const haystack = (msgEl.getAttribute("data-search-text") || msgEl.textContent || "").toLowerCase();
          if (haystack.indexOf(q) !== -1) {
            msgEl.classList.remove("is-search-hidden");
            msgEl.classList.add("is-search-match");
            matchedCount += 1;
          } else {
            msgEl.classList.add("is-search-hidden");
            msgEl.classList.remove("is-search-match");
          }
        });

        if (searchStatus) {
          if (!q) {
            searchStatus.textContent = "";
          } else if (matchedCount > 0) {
            searchStatus.textContent = "Tìm thấy " + matchedCount + " tin nhắn phù hợp";
          } else {
            searchStatus.textContent = "Không tìm thấy tin nhắn nào";
          }
        }
      }

      if (searchToggleBtn && searchPanel && searchInput) {
        searchToggleBtn.addEventListener("click", function () {
          const willOpen = searchPanel.classList.contains("is-hidden");
          searchPanel.classList.toggle("is-hidden");
          searchToggleBtn.classList.toggle("is-active", willOpen);
          searchToggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
          if (willOpen) {
            searchInput.focus();
          } else {
            searchInput.value = "";
            applyChatSearch("");
          }
        });

        searchInput.addEventListener("input", function () {
          applyChatSearch(this.value);
        });

        if (searchClearBtn) {
          searchClearBtn.addEventListener("click", function () {
            searchInput.value = "";
            applyChatSearch("");
            searchPanel.classList.add("is-hidden");
            searchToggleBtn.classList.remove("is-active");
            searchToggleBtn.setAttribute("aria-expanded", "false");
          });
        }
      }

      document.querySelectorAll(".sidebar-accordion-trigger").forEach(function (trigger) {
        trigger.addEventListener("click", function () {
          const targetId = trigger.getAttribute("data-drawer-target");
          const drawer = targetId ? document.getElementById(targetId) : null;
          if (!drawer) return;
          const willExpand = drawer.classList.contains("is-hidden");
          drawer.classList.toggle("is-hidden");
          trigger.setAttribute("aria-expanded", willExpand ? "true" : "false");
        });
      });

      const renameToggleBtn = document.getElementById("toggle-rename-btn");
      const renamePanel = document.getElementById("rename-convo-panel");
      const renameInput = document.getElementById("rename-convo-input");
      const cancelRenameBtn = document.getElementById("cancel-rename-btn");
      if (renameToggleBtn && renamePanel && renameInput) {
        renameToggleBtn.addEventListener("click", function () {
          const willOpen = renamePanel.classList.contains("is-hidden");
          renamePanel.classList.toggle("is-hidden");
          renameToggleBtn.classList.toggle("is-active", willOpen);
          renameToggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
          if (willOpen) {
            renameInput.focus();
            renameInput.select();
          }
        });
        if (cancelRenameBtn) {
          cancelRenameBtn.addEventListener("click", function () {
            renamePanel.classList.add("is-hidden");
            renameToggleBtn.classList.remove("is-active");
            renameToggleBtn.setAttribute("aria-expanded", "false");
          });
        }
      }
    });
  </script>
