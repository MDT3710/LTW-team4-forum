      <div id="rename-convo-panel" class="sidebar-rename-panel is-hidden shadow-sm">
        <form method="POST" action="{% url 'rename_conversation' convo_id %}" class="sidebar-rename-form">
          {% csrf_token %}
          <input type="text" id="rename-convo-input" name="nickname" value="{{ current_name|default:'' }}" placeholder="{{ placeholder }}" maxlength="255" autocomplete="off" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:border-[#134c81] outline-none">
          <div class="sidebar-rename-actions flex items-center justify-end gap-2 mt-2">
            {% if is_direct and current_name %}
              <button type="submit" name="reset" value="1" class="px-2.5 py-1 text-xs text-slate-500 hover:text-slate-700 rounded cursor-pointer">Mặc định</button>
            {% else %}
              <button type="button" id="cancel-rename-btn" class="px-2.5 py-1 text-xs text-slate-500 hover:text-slate-700 rounded cursor-pointer">Hủy</button>
            {% endif %}
            <button type="submit" class="px-3 py-1 text-xs bg-[#134c81] text-white rounded font-medium hover:bg-[#0e3b65] transition cursor-pointer">Lưu</button>
          </div>
        </form>
      </div>
