{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu · ScotsMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4" style="font-family: 'Inter', sans-serif;">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-[#134c81] flex items-center justify-center mx-auto mb-3">
        <img src="{% static 'img/logo_no_text.png' %}" alt="Scots English" class="w-7 h-7 object-contain" />
      </div>
      <h1 class="text-xl font-bold text-[#134c81]">Đặt lại mật khẩu</h1>
      <p class="text-xs text-slate-500 mt-1">Nhập email doanh nghiệp đã đăng ký để nhận liên kết khôi phục mật khẩu từ hệ thống.</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {% if form.errors %}
        <div class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs">
          Vui lòng kiểm tra lại địa chỉ email hợp lệ.
        </div>
      {% endif %}
      <div>
        <label for="id_email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email tài khoản</label>
        <input type="email" name="email" id="id_email" required placeholder="vd: minhanh@scotsenglish.edu.vn"
               class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-[#134c81]" />
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-[#134c81] hover:bg-[#0f3d68] text-white text-sm font-bold cursor-pointer transition">
        Gửi yêu cầu đặt lại mật khẩu
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="{% url 'login' %}" class="text-xs font-semibold text-[#134c81] hover:underline">← Quay lại trang đăng nhập</a>
    </div>
  </div>
</body>
</html>
