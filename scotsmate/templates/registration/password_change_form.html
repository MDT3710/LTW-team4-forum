{% extends 'base.html' %}
{% block title %}Đổi mật khẩu | ScotsMate{% endblock %}
{% block content %}
<main class="w-full max-w-md mx-auto px-4 py-12">
  <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
    <h1 class="text-xl font-bold text-[#134c81] mb-1">Đổi mật khẩu cá nhân</h1>
    <p class="text-xs text-slate-500 mb-6">Tự cập nhật mật khẩu đăng nhập để bảo mật tài khoản ScotsMate.</p>

    <form method="POST" class="space-y-4 text-xs">
      {% csrf_token %}
      {% if form.errors %}
        <div class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700">
          {{ form.errors }}
        </div>
      {% endif %}
      <div>
        <label for="id_old_password" class="block font-semibold text-slate-700 mb-1">Mật khẩu hiện tại</label>
        <input type="password" name="old_password" id="id_old_password" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-[#134c81]" />
      </div>
      <div>
        <label for="id_new_password1" class="block font-semibold text-slate-700 mb-1">Mật khẩu mới</label>
        <input type="password" name="new_password1" id="id_new_password1" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-[#134c81]" />
      </div>
      <div>
        <label for="id_new_password2" class="block font-semibold text-slate-700 mb-1">Xác nhận mật khẩu mới</label>
        <input type="password" name="new_password2" id="id_new_password2" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-[#134c81]" />
      </div>
      <div class="flex items-center justify-end gap-3 pt-2">
        <a href="{% url 'profile' %}" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50" style="text-decoration:none;">Hủy</a>
        <button type="submit" class="px-5 py-2 rounded-lg bg-[#134c81] hover:bg-[#0f3d68] text-white font-bold cursor-pointer">Cập nhật mật khẩu</button>
      </div>
    </form>
  </div>
</main>
{% endblock %}
