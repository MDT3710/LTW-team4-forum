<div id="docDetailModal" class="doc-modal-backdrop" style="display: none;" onclick="if (event.target === this) closeDocDetailModal();">
  <div class="doc-modal" style="max-width: 640px; gap: 18px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line, #e2e8f0); padding-bottom:14px;">
      <div>
        <span id="modalDocCode" style="font-size:11px; font-weight:700; color:var(--navy, #134c81); text-transform:uppercase; letter-spacing:0.05em;"></span>
        <h3 id="modalDocTitle" style="font-size:18px; font-weight:700; color:var(--ink, #0f172a); margin:4px 0 0 0;"></h3>
      </div>
      <button type="button" onclick="closeDocDetailModal()" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--line, #e2e8f0); background:#fff; color:#475569; cursor:pointer; font-weight:700; flex-shrink:0;">✕</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px; font-size:13px; color:#334155;">
      <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; background:#f8fafc; padding:12px 14px; border-radius:8px; border:1px solid var(--line, #e2e8f0);">
        <div>
          <span style="color:#64748b; font-size:11px; display:block;">Danh mục</span>
          <strong id="modalDocCategory" style="color:#0f172a;"></strong>
        </div>
        <div>
          <span style="color:#64748b; font-size:11px; display:block;">Người đăng tải</span>
          <strong id="modalDocCreator" style="color:#0f172a;"></strong>
        </div>
        <div>
          <span style="color:#64748b; font-size:11px; display:block;">Phạm vi truy cập</span>
          <strong id="modalDocScope" style="color:#0f172a;"></strong>
        </div>
        <div>
          <span style="color:#64748b; font-size:11px; display:block;">Cập nhật gần nhất</span>
          <strong id="modalDocDate" style="color:#0f172a;"></strong>
        </div>
      </div>

      <div>
        <span style="font-size:12px; font-weight:700; color:#475569; display:block; margin-bottom:6px;">Mô tả tóm tắt đầy đủ</span>
        <p id="modalDocDescription" style="margin:0; padding:12px 14px; border-radius:8px; border:1px solid var(--line, #e2e8f0); background:#fff; color:#1e293b; line-height:1.6; white-space:pre-wrap; word-break:break-word;"></p>
      </div>

      <div id="modalDocRejectionWrap" style="display:none; padding:10px 12px; border-radius:8px; background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; font-size:12px;">
        <strong>Lý do từ chối:</strong> <span id="modalDocRejection"></span>
      </div>

      <div id="modalDocPdfPreviewWrap" style="display:none; border:1px solid var(--line, #e2e8f0); border-radius:8px; overflow:hidden; background:#f8fafc;">
        <iframe id="modalDocPdfFrame" src="about:blank" style="width:100%; height:280px; border:none;"></iframe>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:flex-end; gap:10px; padding-top:12px; border-top:1px solid var(--line, #e2e8f0); flex-wrap:wrap;">
      <a id="modalDocViewTab" href="#" target="_blank" class="doc-btn doc-btn-secondary" style="height:36px; padding:0 14px; font-size:13px; display:none;">Xem tệp trực tiếp ↗</a>
      <a id="modalDocDownload" href="#" download class="doc-btn doc-btn-primary" style="height:36px; padding:0 16px; font-size:13px; display:none;">Tải tài liệu</a>
      <button type="button" onclick="closeDocDetailModal()" class="doc-btn doc-btn-secondary" style="height:36px; padding:0 16px; font-size:13px;">Đóng</button>
    </div>
  </div>
</div>

<script>
  function openDocDetailModal(btn) {
    const modal = document.getElementById('docDetailModal');
    if (!modal || !btn) return;
    document.getElementById('modalDocCode').textContent = btn.dataset.code || '';
    document.getElementById('modalDocTitle').textContent = btn.dataset.title || '';
    document.getElementById('modalDocCategory').textContent = btn.dataset.category || '--';
    document.getElementById('modalDocCreator').textContent = btn.dataset.creator || '--';
    document.getElementById('modalDocScope').textContent = btn.dataset.scope || 'Toàn hệ thống';
    document.getElementById('modalDocDate').textContent = btn.dataset.date || '--';
    document.getElementById('modalDocDescription').textContent = btn.dataset.description || 'Chưa có mô tả chi tiết.';

    const rejWrap = document.getElementById('modalDocRejectionWrap');
    const rejText = btn.dataset.rejection || '';
    if (rejText) {
      document.getElementById('modalDocRejection').textContent = rejText;
      rejWrap.style.display = 'block';
    } else {
      rejWrap.style.display = 'none';
    }

    const viewTab = document.getElementById('modalDocViewTab');
    const dl = document.getElementById('modalDocDownload');
    const pdfWrap = document.getElementById('modalDocPdfPreviewWrap');
    const pdfFrame = document.getElementById('modalDocPdfFrame');
    const fileUrl = btn.dataset.file || '';
    if (fileUrl) {
      dl.href = fileUrl;
      dl.style.display = 'inline-flex';
      viewTab.href = fileUrl;
      viewTab.style.display = 'inline-flex';
      if (fileUrl.toLowerCase().split('?')[0].endsWith('.pdf')) {
        pdfFrame.src = fileUrl;
        pdfWrap.style.display = 'block';
      } else {
        pdfFrame.src = 'about:blank';
        pdfWrap.style.display = 'none';
      }
    } else {
      dl.style.display = 'none';
      viewTab.style.display = 'none';
      pdfFrame.src = 'about:blank';
      pdfWrap.style.display = 'none';
    }

    modal.style.display = 'flex';
  }

  function closeDocDetailModal() {
    const modal = document.getElementById('docDetailModal');
    if (!modal) return;
    const pdfFrame = document.getElementById('modalDocPdfFrame');
    if (pdfFrame) pdfFrame.src = 'about:blank';
    modal.style.display = 'none';
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDocDetailModal();
  });
</script>
